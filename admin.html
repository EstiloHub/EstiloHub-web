<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Admin</title>

<style>

body{
  margin:0;
  background:#FFFFFF;
  color:#222222;
  font-family:Arial, sans-serif;

}

.container{
    max-width:700px;
    margin:auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

button{
    width:100%;
    padding:18px;
    margin-bottom:18px;
    background:#222;
    color:white;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;

}

button:hover{
    background:#333;

}

.volver{
    background:#555;

}

</style>
</head>

<body>

<div class="container">

<h1>👑 Panel Admin</h1>

<button onclick="window.location.href='usuarios.html'">
👥 Usuarios Activos
</button>

<button onclick="window.location.href='historial_usuarios.html'">
🕓 Historial de usuarios
</button>

<button onclick="window.location.href='codigos.html'">
🔑 Códigos
</button>

<button onclick="window.location.href='tareas_admin.html'">
📋 Tareas
</button>

<button onclick="window.location.href='estadisticas.html'">
📊 Estadísticas
</button>

<button class="volver"
onclick="window.location.href='inicio.html'">

⬅️ Volver

</button>
    
</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


onAuthStateChanged(auth, async (user) => {

if (!user) {

window.location.href = "index.html";
return;

}

try {

const usuarioRef =
doc(db, "users", user.uid);

const usuarioSnap =
await getDoc(usuarioRef);

if (
!usuarioSnap.exists() ||
usuarioSnap.data().admin !== true

) {

window.location.href = "inicio.html";
return;

}

} catch (error) {

window.location.href = "inicio.html";

}

});

</script>
</body>
</html>
