<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro</title>

<style>

body {
    margin: 0;
    background: #FFFFFF;
    color: #222222;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 60px 20px;
    text-align: center;
}

h1 {
    margin-bottom: 40px;
}

.campo {
    position: relative;
    width: 100%;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px 48px 12px 12px;
    border: none;
    border-radius: 10px;
    box-sizing: border-box;
}

.mostrar {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    margin: 0;
    padding: 5px;
    background: transparent;
    color: #222222;
    border: none;
    cursor: pointer;
    font-size: 18px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.crear {
    background: #2196F3;
    color: white;
}

.volver {
    background: #4CAF50;
    color: white;
}

#mensaje {
    margin-top: 20px;
    font-size: 15px;
}

</style>
</head>

<body>

<div class="container">

<h1>Registro</h1>

<input
    id="email"
    type="email"
    placeholder="Correo electrónico"
    autocomplete="email"
>

<div class="campo">
    <input
        id="password"
        type="password"
        placeholder="Contraseña"
        autocomplete="new-password"
    >
    <button
        type="button"
        class="mostrar"
        data-target="password"
        aria-label="Mostrar contraseña"
    >👁</button>
</div>

<div class="campo">
    <input
        id="confirmPassword"
        type="password"
        placeholder="Confirmar contraseña"
        autocomplete="new-password"
    >
    <button
        type="button"
        class="mostrar"
        data-target="confirmPassword"
        aria-label="Mostrar confirmación de contraseña"
    >👁</button>
</div>

<input
    id="payoneer"
    type="email"
    placeholder="Correo asociado a Payoneer"
    autocomplete="email"
>

<div class="campo">
    <input
        id="codigo"
        type="password"
        placeholder="Código de acceso"
        autocomplete="off"
    >
    <button
        type="button"
        class="mostrar"
        data-target="codigo"
        aria-label="Mostrar código de acceso"
    >👁</button>
</div>

<button id="crearCuentaBtn" class="crear" type="button">
    Crear cuenta
</button>

<button
    class="volver"
    type="button"
    onclick="window.location.href='index.html'"
>
    Volver atrás
</button>

<div id="mensaje"></div>

</div>

<script>

const botonCrear = document.getElementById("crearCuentaBtn");
const email = document.getElementById("email");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const payoneer = document.getElementById("payoneer");
const codigo = document.getElementById("codigo");
const mensaje = document.getElementById("mensaje");

document.querySelectorAll(".mostrar").forEach((boton) => {

    boton.addEventListener("click", () => {

        const campo = document.getElementById(boton.dataset.target);

        if (campo.type === "password") {
            campo.type = "text";
            boton.textContent = "🙈";
        } else {
            campo.type = "password";
            boton.textContent = "👁";
        }

    });

});

botonCrear.addEventListener("click", async () => {

    mensaje.textContent = "";
    botonCrear.disabled = true;
    botonCrear.textContent = "Creando cuenta...";

    const emailLimpio = email.value.trim();
    const payoneerLimpio = payoneer.value.trim();
    const codigoLimpio = codigo.value.trim();

    if (emailLimpio === "") {
        alert("Ingrese un correo electrónico.");
        botonCrear.disabled = false;
        botonCrear.textContent = "Crear cuenta";
        return;
    }

    if (password.value === "") {
        alert("Ingrese una contraseña.");
        botonCrear.disabled = false;
        botonCrear.textContent = "Crear cuenta";
        return;
    }

    if (confirmPassword.value === "") {
        alert("Confirme la contraseña.");
        botonCrear.disabled = false;
        botonCrear.textContent = "Crear cuenta";
        return;
    }

    if (password.value !== confirmPassword.value) {
        alert("Las contraseñas no coinciden.");
        botonCrear.disabled = false;
        botonCrear.textContent = "Crear cuenta";
        return;
    }

    if (password.value.length < 6) {
        alert("La contraseña debe tener al menos 6 caracteres.");
        botonCrear.disabled = false;
        botonCrear.textContent = "Crear cuenta";
        return;
    }

    if (payoneerLimpio === "") {
        alert("Ingrese su correo de Payoneer.");
        botonCrear.disabled = false;
        botonCrear.textContent = "Crear cuenta";
        return;
    }

    if (codigoLimpio === "") {
        alert("Ingrese el código de acceso.");
        botonCrear.disabled = false;
        botonCrear.textContent = "Crear cuenta";
        return;
    }

    try {

        const respuesta = await fetch("/api/registro", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: emailLimpio,
                password: password.value,
                payoneer: payoneerLimpio,
                codigo: codigoLimpio
            })
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok || !resultado.ok) {
            alert(resultado.error || "No se pudo crear la cuenta.");
            botonCrear.disabled = false;
            botonCrear.textContent = "Crear cuenta";
            return;
        }

        alert("¡Cuenta creada correctamente!");
        window.location.href = "inicio.html";

    } catch (error) {

        alert("No se pudo conectar con el servidor. Inténtelo nuevamente.");

        botonCrear.disabled = false;
        botonCrear.textContent = "Crear cuenta";
    }

});

</script>

</body>
    </html>
