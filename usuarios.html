<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuarios</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    margin-bottom:35px;
}

.usuario{

    background:#1b1b1b;
    border:1px solid #444;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;

}

p{

    margin:8px 0;

}

button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:15px;
    font-size:16px;

}

.volver{

    background:#555;
    color:white;

} 

.ver{

background:#2196F3;
color:white;
margin-bottom:10px;

}

</style>

</head>

<body>

<div class="container">

<h1>Usuarios Activos</h1>

<input type="text" id="buscarUsuario" placeholder="🔍 Buscar por email..."
style="width:100%;padding:10px;margin:15px 0;font-size:16px;">

<label for="ordenUsuarios"><strong>Ordenar:</strong></label>

<select id="ordenUsuarios">

<option value="reciente">Más recientes</option>

<option value="antiguo">Más antiguos</option>

<option value="az">Email A → Z</option>

<option value="za">Email Z → A</option>

</select>
    
<div id="listaUsuarios"></div>

<div id="paginacionUsuarios" style="margin-top:20px;text-align:center;">

<button id="anteriorUsuarios">
⬅️ Anterior
</button>

<span id="paginaUsuarios">
Página 1
</span>

<button id="siguienteUsuarios">
Siguiente ➡️
</button>

</div>

<button
class="volver"
onclick="window.location.href='admin.html'">

Volver

</button>

</div>
  
<script type="module">

import { db } from "./firebase.js";

import {

collection,
query,
where,
getDocs,
doc,
getDoc,
setDoc,
updateDoc

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const listaUsuarios = document.getElementById("listaUsuarios");

const buscarUsuario = document.getElementById("buscarUsuario");

let textoBusqueda = "";

let ordenActual = "reciente";

let paginaActual = 1;

const usuariosPorPagina = 10;

async function cargarUsuarios(){

listaUsuarios.innerHTML = "";

const consulta = query(

collection(db,"users"),

where("activo","==",true)

);

const usuarios = await getDocs(consulta);

let lista = usuarios.docs;

// =====================
// ORDEN
// =====================

if (ordenActual === "az"){

lista.sort((a,b)=>

(a.data().email || "")
.localeCompare(b.data().email || "")

);

}

if (ordenActual === "za"){

lista.sort((a,b)=>

(b.data().email || "")
.localeCompare(a.data().email || "")

);

}

if (ordenActual === "reciente"){

lista.sort((a,b)=>

(b.data().fechaRegistro?.seconds || 0) -

(a.data().fechaRegistro?.seconds || 0)

);

}

if (ordenActual === "antiguo"){

lista.sort((a,b)=>

(a.data().fechaRegistro?.seconds || 0) -

(b.data().fechaRegistro?.seconds || 0)

);

}

// =====================
// BUSCADOR
// =====================

lista = lista.filter((docu)=>{

const usuario = docu.data();

const email = (usuario.email || "").toLowerCase();

return email.includes(textoBusqueda);

});

// =====================
// PAGINACIÓN
// =====================

const inicio = (paginaActual - 1) * usuariosPorPagina;

const fin = inicio + usuariosPorPagina;

const totalPaginas = Math.max(1,
Math.ceil(lista.length / usuariosPorPagina));

lista = lista.slice(inicio, fin);

document.getElementById("paginaUsuarios").textContent =
"Página " + paginaActual;

lista.forEach((docu)=>{

const usuario = docu.data();

listaUsuarios.innerHTML += `

<div class="usuario">

<p><strong>📧 Email:</strong> ${usuario.email}</p>

<p><strong>🆔 UID:</strong> ${usuario.usuario_id}</p>

<button
class="ver"
onclick="window.location.href='perfil_usuario.html?id=${docu.id}&origen=usuarios'">

👤 Ver perfil

</button>

</div>

`;

});

}
    
await cargarUsuarios(); 
    
let temporizadorBusqueda;

buscarUsuario.addEventListener("input", (e) => {

clearTimeout(temporizadorBusqueda);

textoBusqueda = e.target.value.toLowerCase();

paginaActual = 1;

temporizadorBusqueda = setTimeout(() => {

cargarUsuarios();

}, 250);

});

const ordenUsuarios = document.getElementById("ordenUsuarios");

ordenUsuarios.addEventListener("change", (e) => {

ordenActual = e.target.value;

paginaActual = 1;

cargarUsuarios();

});

document.getElementById("anteriorUsuarios").addEventListener("click", () => {

if (paginaActual > 1){

paginaActual--;

cargarUsuarios();

}

});

document.getElementById("siguienteUsuarios").addEventListener("click", async () => {

const consulta = query(

collection(db,"users"),

where("activo","==",true)

);

const usuarios = await getDocs(consulta);

let lista = usuarios.docs;

// Aplicar filtro para calcular las páginas correctamente
lista = lista.filter((docu)=>{

const usuario = docu.data();

return (usuario.email || "").toLowerCase().includes(textoBusqueda);

});

const totalPaginas = Math.max(1, Math.ceil(lista.length / usuariosPorPagina));

if (paginaActual < totalPaginas){

paginaActual++;

cargarUsuarios();

}

});
    
</script>

</body>

</html>
