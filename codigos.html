<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestión de Códigos</title>

<style>

body{
  margin:0;
  background:#FFFFFF;
  color:#222222;
  font-family:Arial, sans-serif;

}

.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.resumen{
    display:flex;
    gap:15px;
    margin-bottom:25px;
}

.contador{
    flex:1;
    background:#1b1b1b;
    border:1px solid #444;
    border-radius:12px;
    padding:18px;
    text-align:center;
}

.generador{
    background:#1b1b1b;
    border:1px solid #444;
    border-radius:12px;
    padding:20px;
    margin-bottom:25px;
}

input,
select{
    box-sizing:border-box;
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #555;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:15px;
    font-size:16px;
}

.generar{
    background:#4CAF50;
    color:white;
}

.buscar{
    margin-bottom:20px;
}

.codigo{
    background:#1b1b1b;
    border:1px solid #444;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.copiar{
    background:#2196F3;
    color:white;
}

.liberar{
    background:#e67e22;
    color:white;
}

.volver{
    background:#555;
    color:white;
    margin-top:25px;
}

@media(max-width:600px){

.resumen{
flex-direction:column;

}

}

</style>
</head>

<body>

<div class="container">

<h1>🎟️ Gestión de Códigos</h1>

<div class="resumen">

<div class="contador">

<strong>🟢 Disponibles</strong>

<p id="contadorDisponibles">0</p>

</div>

<div class="contador">

<strong>🔴 Usados</strong>

<p id="contadorUsados">0</p>

</div>

</div>

<div class="generador">

<h2>🪄 Generar códigos</h2>

<label for="cantidadCodigos">

¿Cuántos códigos deseas generar?

</label>

<input
type="number"
id="cantidadCodigos"
min="1"
max="100"
value="10"
>

<button
class="generar"
id="generarCodigos">

🪄 Generar códigos

</button>

</div>

<div class="generador">

<h2>✨ Crear código personalizado</h2>

<label for="codigoPersonalizado">

Escribe el código que deseas crear:

</label>

<input
type="text"
id="codigoPersonalizado"
placeholder="Ej: EH-ADMIN1"
maxlength="9"
>

<button
class="generar"
id="crearCodigoPersonalizado">

✨ Crear código

</button>

</div>
    
<input
type="text"
id="buscarCodigo"
class="buscar"
placeholder="🔍 Buscar por código o email..."
>

<select id="filtroCodigos">

<option value="disponibles">🟢 Disponibles</option>

<option value="usados">🔴 Usados</option>

</select>

<div id="listaCodigos"></div>

<button
class="volver"
onclick="window.location.href='admin.html'">

⬅️ Volver

</button>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    collection,
    getDocs,
    doc,
    setDoc,
    serverTimestamp,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

onAuthStateChanged(auth, async (user) => {

if (!user) {

window.location.href = "index.html";
return;

    
}

const usuarioRef = doc(db, "users", user.uid);

const usuarioSnap = await getDoc(usuarioRef);

if (
  !usuarioSnap.exists() ||
  usuarioSnap.data().admin !== true
    
) {

window.location.href = "inicio.html";
return;

}
  
const cantidadCodigos = document.getElementById("cantidadCodigos");

const generarCodigos = document.getElementById("generarCodigos");

const listaCodigos = document.getElementById("listaCodigos");

const contadorDisponibles =
document.getElementById("contadorDisponibles");

const contadorUsados =
document.getElementById("contadorUsados");

const buscarCodigo =
document.getElementById("buscarCodigo");

const filtroCodigos =
document.getElementById("filtroCodigos");


// =====================
// GENERAR CÓDIGO
// =====================

function generarCodigo(){

const caracteres =
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let codigo = "EH-";

for(let i = 0; i < 6; i++){

codigo += caracteres.charAt(
Math.floor(Math.random() * caracteres.length)

);

}

return codigo;

}


// =====================
// CARGAR CÓDIGOS
// =====================

async function cargarCodigos(){

listaCodigos.innerHTML = "";

const snapshot =
await getDocs(collection(db,"codigos"));

let disponibles = 0;

let usados = 0;

snapshot.forEach((docu)=>{

const codigo = docu.data();

if(codigo.estado === "disponible"){

disponibles++;

}

if(codigo.estado === "usado"){

usados++;

}

});

contadorDisponibles.textContent = disponibles;

contadorUsados.textContent = usados;

}

// =====================
// GENERAR LOTE
// =====================

generarCodigos.addEventListener("click", async () => {

const cantidad = Number(cantidadCodigos.value);

if (!cantidad || cantidad < 1 || cantidad > 100){

alert("La cantidad debe estar entre 1 y 100.");

return;

}

generarCodigos.disabled = true;

generarCodigos.textContent = "⏳ Generando...";

try {

const snapshot =
await getDocs(collection(db,"codigos"));

const existentes = new Set();

snapshot.forEach((docu)=>{

const datos = docu.data();

if(datos.codigo){

existentes.add(datos.codigo);

}

});

let generados = 0;

while(generados < cantidad){

const codigo = generarCodigo();

if(existentes.has(codigo)){

continue;

}

await setDoc(
doc(db,"codigos",codigo),
{

codigo: codigo,

estado: "disponible",

fecha_creacion: serverTimestamp(),

email: null,

usuario_id: null,

fecha_uso: null,

liberado: false,

fecha_liberacion: null

}
    
);

existentes.add(codigo);

generados++;

}

alert(
"✅ Se generaron " + generados + " códigos correctamente."

);

await cargarCodigos();

} catch(error){

alert("❌ Ocurrió un error al generar los códigos.");

} finally {

generarCodigos.disabled = false;

generarCodigos.textContent =
"🪄 Generar códigos";

}

});

// =====================
// CARGA INICIAL
// =====================

await cargarCodigos();

// =====================
// MOSTRAR CÓDIGOS
// =====================

async function mostrarCodigos(){

listaCodigos.innerHTML = "";

const snapshot =
await getDocs(collection(db,"codigos"));

let lista = snapshot.docs;

const texto =
buscarCodigo.value.toLowerCase().trim();

const filtro =
filtroCodigos.value;

lista = lista.filter((docu)=>{

const codigo = docu.data();

const codigoTexto =
(codigo.codigo || "").toLowerCase();

const emailTexto =
(codigo.email || "").toLowerCase();

const coincideBusqueda =
codigoTexto.includes(texto) ||
emailTexto.includes(texto);

const coincideFiltro =
codigo.estado === (
filtro === "disponibles"
? "disponible"
: "usado"
);

return coincideBusqueda && coincideFiltro;

});

lista.forEach((docu)=>{

const codigo = docu.data();

let html = `

<div class="codigo">

<p>
<strong>🎟️ Código:</strong>
${codigo.codigo}
</p>

`;

if(codigo.estado === "disponible"){

html += `

<p>
<strong>🟢 Estado:</strong>
Disponible
</p>

<button
class="copiar"
data-codigo="${codigo.codigo}">

📋 Copiar código

</button>

`;

}else{

html += `

<p>
<strong>🔴 Estado:</strong>
Usado
</p>

<p>
<strong>📧 Usuario:</strong>
${codigo.email || "Sin información"}
</p>

<p>
<strong>📅 Fecha de uso:</strong>
${codigo.fecha_uso
? new Date(
codigo.fecha_uso.seconds * 1000
).toLocaleString("es-AR")
: "Sin información"}
</p>

<button
class="copiar"
data-codigo="${codigo.codigo}">

📋 Copiar código

</button>

<button
class="liberar"
data-id="${docu.id}">

🔓 Liberar código

</button>

`;

}

html += `

</div>

`;

listaCodigos.innerHTML += html;

});

}


// =====================
// BUSCADOR
// =====================

buscarCodigo.addEventListener("input", () => {

mostrarCodigos();

});


// =====================
// FILTRO
// =====================

filtroCodigos.addEventListener("change", () => {

mostrarCodigos();

});


// =====================
// CARGA INICIAL
// =====================

await mostrarCodigos();

// =====================
// COPIAR CÓDIGO
// =====================

document.addEventListener("click", async (e) => {

if(!e.target.classList.contains("copiar")) return;

const codigo = e.target.dataset.codigo;

try {

await navigator.clipboard.writeText(codigo);

alert("📋 Código copiado");

} catch(error) {

alert("❌ No se pudo copiar el código.");

}

});


// =====================
// LIBERAR CÓDIGO
// =====================

document.addEventListener("click", async (e) => {

if(!e.target.classList.contains("liberar")) return;

const id = e.target.dataset.id;

const confirmar = confirm(
"⚠️ ¿Seguro que deseas liberar este código?\n\n" +
"El código volverá a estar disponible para un nuevo registro.\n\n" +
"📚 El historial del usuario que lo utilizó no será eliminado."
);

if(!confirmar) return;

try {

await setDoc(

doc(db,"codigos",id),

{

estado: "disponible",

liberado: true,

fecha_liberacion: serverTimestamp()

},

{ merge: true }

);

alert("🔓 Código liberado correctamente.");

await cargarCodigos();

await mostrarCodigos();

} catch(error) {

alert("❌ No se pudo liberar el código.");

}

});

// =====================
// CREAR CÓDIGO PERSONALIZADO
// =====================

const codigoPersonalizado =
document.getElementById("codigoPersonalizado");

const crearCodigoPersonalizado =
document.getElementById("crearCodigoPersonalizado");

crearCodigoPersonalizado.addEventListener("click", async () => {

const codigo = codigoPersonalizado.value
    .trim()
    .toUpperCase();

if (codigo === "") {

alert("❌ Escribe un código.");

return;

}

if (!codigo.startsWith("EH-")) {

alert("❌ El código no es válido.");

return;

}

if (codigo.length < 6 || codigo.length > 9) {

alert("❌ El código no es válido.");

return;

}

try {

const codigoRef = doc(db, "codigos", codigo);

const existente = await getDocs(
    query(
        collection(db, "codigos"),
        where("codigo", "==", codigo)
    )
);

if (!existente.empty) {

alert("❌ Ese código ya existe.");

return;

}

await setDoc(codigoRef, {

codigo: codigo,

estado: "disponible",

tipo: "personalizado",

fecha_creacion: serverTimestamp(),

email: null,

usuario_id: null,

fecha_uso: null,

liberado: false,

fecha_liberacion: null

});

codigoPersonalizado.value = "";

alert("✅ Código personalizado creado correctamente.");

await cargarCodigos();

await mostrarCodigos();

} catch(error) {

alert("❌ No se pudo crear el código.");

}

});

});
  
</script>
</body>
</html>
