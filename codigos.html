<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Gestión de Códigos</title>

<style>

body{
    margin:0;
    background:#FFFFFF;
    color:#222222;
    font-family:Arial, sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.resumen{
    display:flex;
    gap:15px;
    margin-bottom:25px;
}

.contador{
    flex:1;
    background:#1b1b1b;
    color:#FFFFFF;
    border:1px solid #444;
    border-radius:12px;
    padding:18px;
    text-align:center;
}

.generador{
    background:#1b1b1b;
    color:#FFFFFF;
    border:1px solid #444;
    border-radius:12px;
    padding:20px;
    margin-bottom:25px;
}

.generador label{
    display:block;
    margin-top:10px;
}

input,
select{
    box-sizing:border-box;
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #555;
    font-size:16px;
    background:#FFFFFF;
    color:#222222;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:15px;
    font-size:16px;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.generar{
    background:#4CAF50;
    color:white;
}

.buscar{
    margin-bottom:20px;
}

.codigo{
    background:#1b1b1b;
    color:#FFFFFF;
    border:1px solid #444;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.copiar{
    background:#2196F3;
    color:white;
}

.asignar{
    background:#9C27B0;
    color:white;
}

.liberar{
    background:#e67e22;
    color:white;
}

.volver{
    background:#555;
    color:white;
    margin-top:25px;
}


/* ========================= */
/* PANEL ASIGNAR CÓDIGO */
/* ========================= */

.panelAsignar{
    display:none;
    background:#1b1b1b;
    color:#FFFFFF;
    border:1px solid #444;
    border-radius:12px;
    padding:20px;
    margin-bottom:25px;
}

.panelAsignar h2{
    margin-top:0;
}

.usuarioResultado{
    background:#2a2a2a;
    border:1px solid #555;
    border-radius:10px;
    padding:15px;
    margin-top:10px;
}

.usuarioResultado button{
    background:#4CAF50;
    color:white;
}

.cancelarAsignacion{
    background:#555;
    color:white;
}


/* ========================= */
/* RESPONSIVE */
/* ========================= */

@media(max-width:600px){

    .resumen{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>🎟️ Gestión de Códigos</h1>


<!-- ===================== -->
<!-- RESUMEN -->
<!-- ===================== -->

<div class="resumen">

<div class="contador">

<strong>🟢 Disponibles</strong>

<p id="contadorDisponibles">0</p>

</div>

<div class="contador">

<strong>🔴 Usados</strong>

<p id="contadorUsados">0</p>

</div>

</div>


<!-- ===================== -->
<!-- GENERAR LOTE -->
<!-- ===================== -->

<div class="generador">

<h2>🪄 Generar códigos</h2>

<label for="prefijoCodigo">
Prefijo del código:
</label>

<input
type="text"
id="prefijoCodigo"
placeholder="Ej: F1-"
maxlength="20"
>

<label for="cantidadCodigos">
¿Cuántos códigos deseas generar?
</label>

<input
type="number"
id="cantidadCodigos"
min="1"
max="100"
value="10"
>

<button
class="generar"
id="generarCodigos"
>
🪄 Generar códigos
</button>

</div>


<!-- ===================== -->
<!-- CÓDIGO PERSONALIZADO -->
<!-- ===================== -->

<div class="generador">

<h2>✨ Crear código personalizado</h2>

<label for="codigoPersonalizado">
Escribe el código que deseas crear:
</label>

<input
type="text"
id="codigoPersonalizado"
placeholder="Ej: EH-ABCDEFG"
maxlength="30"
>

<button
class="generar"
id="crearCodigoPersonalizado"
>
✨ Crear código
</button>

</div>


<!-- ===================== -->
<!-- PANEL ASIGNAR -->
<!-- ===================== -->

<div
id="panelAsignar"
class="panelAsignar"
>

<h2>👤 Asignar código</h2>

<p id="codigoAAsignar"></p>

<label for="buscarUsuario">
Buscar usuario por email:
</label>

<input
type="text"
id="buscarUsuario"
placeholder="Escribe el email del usuario..."
>

<div id="listaUsuarios"></div>

<button
class="cancelarAsignacion"
id="cancelarAsignacion"
>
❌ Cancelar
</button>

</div>


<!-- ===================== -->
<!-- BUSCAR CÓDIGO -->
<!-- ===================== -->

<input
type="text"
id="buscarCodigo"
class="buscar"
placeholder="🔍 Buscar por código o email..."
>


<!-- ===================== -->
<!-- FILTRO -->
<!-- ===================== -->

<select id="filtroCodigos">

<option value="disponibles">
🟢 Disponibles
</option>

<option value="usados">
🔴 Usados
</option>

</select>


<!-- ===================== -->
<!-- LISTA -->
<!-- ===================== -->

<div id="listaCodigos"></div>


<!-- ===================== -->
<!-- VOLVER -->
<!-- ===================== -->

<button
class="volver"
onclick="window.location.href='admin.html'"
>
⬅️ Volver
</button>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    collection,
    getDocs,
    getDoc,
    doc,
    setDoc,
    serverTimestamp,
    query,
    where,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


// ==================================================
// COMPROBAR ADMIN MEDIANTE CUSTOM CLAIM
// ==================================================

onAuthStateChanged(auth, async (user) => {

if (!user) {

window.location.href = "index.html";

return;

}

try {

const tokenResult =
await user.getIdTokenResult(true);

if (
tokenResult.claims.admin !== true
) {

window.location.href = "inicio.html";

return;

}


// ==================================================
// ELEMENTOS
// ==================================================

const prefijoCodigo =
document.getElementById("prefijoCodigo");

const cantidadCodigos =
document.getElementById("cantidadCodigos");

const generarCodigos =
document.getElementById("generarCodigos");

const codigoPersonalizado =
document.getElementById("codigoPersonalizado");

const crearCodigoPersonalizado =
document.getElementById("crearCodigoPersonalizado");

const listaCodigos =
document.getElementById("listaCodigos");

const contadorDisponibles =
document.getElementById("contadorDisponibles");

const contadorUsados =
document.getElementById("contadorUsados");

const buscarCodigo =
document.getElementById("buscarCodigo");

const filtroCodigos =
document.getElementById("filtroCodigos");

const panelAsignar =
document.getElementById("panelAsignar");

const codigoAAsignar =
document.getElementById("codigoAAsignar");

const buscarUsuario =
document.getElementById("buscarUsuario");

const listaUsuarios =
document.getElementById("listaUsuarios");

const cancelarAsignacion =
document.getElementById("cancelarAsignacion");


// ==================================================
// VARIABLE CÓDIGO A ASIGNAR
// ==================================================

let idCodigoAAsignar = null;


// ==================================================
// GENERAR PARTE ALEATORIA
// ==================================================

function generarCodigo(prefijo){

const caracteres =
"ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

let codigo = prefijo;

for(let i = 0; i < 6; i++){

codigo += caracteres.charAt(
Math.floor(
Math.random() * caracteres.length
)
);

}

return codigo;

}


// ==================================================
// CARGAR CONTADORES
// ==================================================

async function cargarCodigos(){

const snapshot =
await getDocs(
collection(db, "codigos_acceso")
);

let disponibles = 0;

let usados = 0;


snapshot.forEach((docu)=>{

const codigo =
docu.data();

const estado =
String(codigo.estado || "")
.trim()
.toLowerCase();


if(estado === "disponible"){

disponibles++;

}


if(estado === "usado"){

usados++;

}

});


contadorDisponibles.textContent =
disponibles;

contadorUsados.textContent =
usados;

}

// ==================================================
// MOSTRAR CÓDIGOS
// ==================================================

async function mostrarCodigos(){

const snapshot =
await getDocs(
collection(db, "codigos_acceso")
);

const texto =
buscarCodigo.value
.toLowerCase()
.trim();

const filtro =
filtroCodigos.value;

const lista =
snapshot.docs.filter((docu) => {

const codigo =
docu.data();

const codigoTexto =
(codigo.codigo || "")
.toLowerCase();

const emailTexto =
(codigo.email || "")
.toLowerCase();

const coincideBusqueda =
codigoTexto.includes(texto) ||
emailTexto.includes(texto);

const estado =
    String(codigo.estado || "")
        .trim()
        .toLowerCase();

const coincideFiltro =
    (filtro === "disponibles" &&
    estado === "disponible") ||
    (filtro === "usados" &&
    estado === "usado");
)

return (
coincideBusqueda &&
coincideFiltro
);

});


listaCodigos.innerHTML = "";


lista.forEach((docu) => {

const codigo =
docu.data();

let html = `

<div class="codigo">

<p>
<strong>🎟️ Código:</strong>
${codigo.codigo || "Sin código"}
</p>

`;


if(
codigo.estado === "disponible"
){

html += `

<p>
<strong>🟢 Estado:</strong>
Disponible
</p>

<button
class="copiar"
data-codigo="${codigo.codigo}"
>
📋 Copiar código
</button>

<button
class="asignar"
data-id="${docu.id}"
data-codigo="${codigo.codigo}"
>
👤 Asignar código
</button>

`;

} else {

html += `

<p>
<strong>🔴 Estado:</strong>
Usado
</p>

<p>
<strong>📧 Usuario:</strong>
${codigo.email || "Sin información"}
</p>

<p>
<strong>🆔 Usuario ID:</strong>
${codigo.usuario_id || "Sin información"}
</p>

<p>
<strong>📅 Fecha de uso:</strong>

${
codigo.fecha_uso
?
new Date(
codigo.fecha_uso.seconds * 1000
).toLocaleString("es-AR")
:
"Sin información"
}

</p>

<button
class="copiar"
data-codigo="${codigo.codigo}"
>
📋 Copiar código
</button>

<button
class="liberar"
data-id="${docu.id}"
>
🔓 Liberar código
</button>

`;

}


html += `

</div>

`;

listaCodigos.innerHTML += html;

});

}


// ==================================================
// ACTUALIZAR TODO
// ==================================================

async function actualizarVista(){

await cargarCodigos();

await mostrarCodigos();

}


// ==================================================
// GENERAR LOTE
// ==================================================

generarCodigos.addEventListener(
"click",
async () => {

const prefijo =
prefijoCodigo.value.trim();

const cantidad =
Number(cantidadCodigos.value);


if(prefijo === ""){

alert(
"❌ Escribe un prefijo."
);

return;

}


if(
!/^[A-Za-z0-9_-]+$/.test(prefijo)
){

alert(
"❌ El prefijo solo puede contener letras, números, guiones y guiones bajos."
);

return;

}


if(
!Number.isInteger(cantidad) ||
cantidad < 1 ||
cantidad > 100
){

alert(
"❌ La cantidad debe estar entre 1 y 100."
);

return;

}


generarCodigos.disabled =
true;

generarCodigos.textContent =
"⏳ Generando...";


try {

const snapshot =
await getDocs(
collection(db, "codigos_acceso")
);

const existentes =
new Set();


snapshot.forEach((docu)=>{

const datos =
docu.data();

if(datos.codigo){

existentes.add(
datos.codigo
);

}

});


let generados = 0;


while(
generados < cantidad
){

const codigo =
generarCodigo(prefijo);


if(
existentes.has(codigo)
){

continue;

}


await setDoc(

doc(
db,
"codigos_acceso",
codigo
),

{

codigo: codigo,

estado: "disponible",

tipo: "lote",

fecha_creacion:
serverTimestamp(),

email: null,

usuario_id: null,

fecha_uso: null,

liberado: false,

fecha_liberacion: null

}

);


existentes.add(codigo);

generados++;

}


prefijoCodigo.value = "";

alert(
"✅ Se generaron " +
generados +
" códigos correctamente."
);

await actualizarVista();


} catch(error) {

alert(
"❌ No se pudieron generar los códigos.\n\n" +
(error.message ||
"Error desconocido.")
);


} finally {

generarCodigos.disabled =
false;

generarCodigos.textContent =
"🪄 Generar códigos";

}

});


// ==================================================
// CREAR CÓDIGO PERSONALIZADO
// ==================================================

crearCodigoPersonalizado.addEventListener(
"click",
async () => {

const codigo =
codigoPersonalizado.value.trim();


if(codigo === ""){

alert(
"❌ Escribe un código."
);

return;

}


if(codigo.length > 30){

alert(
"❌ El código no puede tener más de 30 caracteres."
);

return;

}


if(
!/^[A-Za-z0-9_-]+$/.test(codigo)
){

alert(
"❌ El código solo puede contener letras, números, guiones y guiones bajos."
);

return;

}


crearCodigoPersonalizado.disabled =
true;

crearCodigoPersonalizado.textContent =
"⏳ Creando...";


try {

const existente =
await getDocs(

query(

collection(
db,
"codigos_acceso"
),

where(
"codigo",
"==",
codigo
)

)

);


if(
!existente.empty
){

alert(
"❌ Ese código ya existe."
);

return;

}


await setDoc(

doc(
db,
"codigos_acceso",
codigo
),

{

codigo: codigo,

estado: "disponible",

tipo: "personalizado",

fecha_creacion:
serverTimestamp(),

email: null,

usuario_id: null,

fecha_uso: null,

liberado: false,

fecha_liberacion: null

}

);


codigoPersonalizado.value = "";

alert(
"✅ Código personalizado creado correctamente."
);

await actualizarVista();


} catch(error) {

alert(
"❌ No se pudo crear el código.\n\n" +
(error.message ||
"Error desconocido.")
);


} finally {

crearCodigoPersonalizado.disabled =
false;

crearCodigoPersonalizado.textContent =
"✨ Crear código";

}

});


// ==================================================
// ABRIR ASIGNACIÓN
// ==================================================

document.addEventListener(
"click",
async (e) => {

if(
!e.target.classList.contains("asignar")
){

return;

}


idCodigoAAsignar =
e.target.dataset.id;

const codigo =
e.target.dataset.codigo;


codigoAAsignar.textContent =
"🎟️ Código seleccionado: " +
codigo;

buscarUsuario.value = "";

listaUsuarios.innerHTML =
"<p>Escribe un email para buscar un usuario.</p>";

panelAsignar.style.display =
"block";

panelAsignar.scrollIntoView({
behavior:"smooth",
block:"start"
});

});


// ==================================================
// BUSCAR USUARIOS
// ==================================================

buscarUsuario.addEventListener(
"input",
async () => {

const texto =
buscarUsuario.value
.toLowerCase()
.trim();


listaUsuarios.innerHTML = "";


if(texto === ""){

listaUsuarios.innerHTML =
"<p>Escribe un email para buscar un usuario.</p>";

return;

}


try {

const snapshot =
await getDocs(
collection(db, "users")
);


const usuarios =
snapshot.docs.filter((docu) => {

const usuario =
docu.data();

const email =
(usuario.email || "")
.toLowerCase();

return (
email.includes(texto) &&
usuario.activo === true
);

});


if(
usuarios.length === 0
){

listaUsuarios.innerHTML =
"<p>No se encontraron usuarios activos.</p>";

return;

}


usuarios.forEach((docu) => {

const usuario =
docu.data();

const div =
document.createElement("div");

div.className =
"usuarioResultado";

div.innerHTML = `

<p>
<strong>📧 Email:</strong>
${usuario.email || "Sin información"}
</p>

<p>
<strong>🆔 Usuario ID:</strong>
${docu.id}
</p>

<button
class="confirmarAsignacion"
data-uid="${docu.id}"
data-email="${usuario.email || ""}"
>
👤 Asignar a este usuario
</button>

`;

listaUsuarios.appendChild(div);

});


} catch(error) {

listaUsuarios.innerHTML =
"<p>No se pudieron cargar los usuarios.</p>";

}

});


// ==================================================
// CONFIRMAR ASIGNACIÓN
// ==================================================

document.addEventListener(
"click",
async (e) => {

if(
!e.target.classList.contains(
"confirmarAsignacion"
)
){

return;

}


if(!idCodigoAAsignar){

alert(
"❌ No hay ningún código seleccionado."
);

return;

}


const uid =
e.target.dataset.uid;

const email =
e.target.dataset.email;


const confirmar =
confirm(

"👤 ¿Asignar este código a este usuario?\n\n" +
"📧 Usuario: " +
email +
"\n" +
"🆔 UID: " +
uid +
"\n\n" +
"El UID del usuario no será modificado."

);


if(!confirmar){

return;

}


try {

await runTransaction(
db,
async (transaction) => {

const codigoRef =
doc(
db,
"codigos_acceso",
idCodigoAAsignar
);

const usuarioRef =
doc(
db,
"users",
uid
);


const codigoSnap =
await transaction.get(
codigoRef
);

const usuarioSnap =
await transaction.get(
usuarioRef
);


if(
!codigoSnap.exists()
){

throw new Error(
"El código ya no existe."
);

}


if(
!usuarioSnap.exists()
){

throw new Error(
"El usuario ya no existe."
);

}


const codigo =
codigoSnap.data();

const usuario =
usuarioSnap.data();


if(
codigo.estado !== "disponible"
){

throw new Error(
"El código ya no está disponible."
);

}


if(
usuario.activo !== true
){

throw new Error(
"El usuario ya no está activo."
);

}


transaction.update(
codigoRef,
{

estado: "usado",

email:
usuario.email || null,

usuario_id:
uid,

fecha_uso:
serverTimestamp(),

liberado: false,

fecha_liberacion: null

}

);

});

alert(
"✅ Código asignado correctamente."
);


panelAsignar.style.display =
"none";

idCodigoAAsignar =
null;

await actualizarVista();


} catch(error) {

alert(
"❌ No se pudo asignar el código.\n\n" +
(error.message ||
"Error desconocido.")
);

}

});


// ==================================================
// CANCELAR ASIGNACIÓN
// ==================================================

cancelarAsignacion.addEventListener(
"click",
() => {

panelAsignar.style.display =
"none";

idCodigoAAsignar =
null;

buscarUsuario.value = "";

listaUsuarios.innerHTML =
"";

});


// ==================================================
// BUSCADOR
// ==================================================

buscarCodigo.addEventListener(
"input",
mostrarCodigos
);


// ==================================================
// FILTRO
// ==================================================

filtroCodigos.addEventListener(
"change",
mostrarCodigos
);


// ==================================================
// COPIAR CÓDIGO
// ==================================================

document.addEventListener(
"click",
async (e) => {

if(
!e.target.classList.contains("copiar")
){

return;

}


const codigo =
e.target.dataset.codigo;


try {

await navigator.clipboard.writeText(
codigo
);

alert(
"📋 Código copiado"
);


} catch(error) {

alert(
"❌ No se pudo copiar el código."
);

}

});


// ==================================================
// LIBERAR CÓDIGO
// ==================================================

document.addEventListener(
"click",
async (e) => {

if(
!e.target.classList.contains("liberar")
){

return;

}


const id =
e.target.dataset.id;


const confirmar =
confirm(

"⚠️ ¿Seguro que deseas liberar este código?\n\n" +

"El código volverá a estar disponible para un nuevo registro.\n\n" +

"📚 El historial del usuario que lo utilizó no será eliminado."

);


if(!confirmar){

return;

}


try {

await setDoc(

doc(
db,
"codigos_acceso",
id
),

{

estado: "disponible",

email: null,

usuario_id: null,

fecha_uso: null,

liberado: true,

fecha_liberacion:
serverTimestamp()

},

{
merge: true
}

);


alert(
"🔓 Código liberado correctamente."
);

await actualizarVista();


} catch(error) {

alert(
"❌ No se pudo liberar el código.\n\n" +
(error.message ||
"Error desconocido.")
);

}

});


// ==================================================
// CARGA INICIAL
// ==================================================

await actualizarVista();


} catch(error) {

alert(
"❌ No se pudo cargar Gestión de Códigos.\n\n" +
(error.message ||
"Error desconocido.")
);

}

});

</script>

</body>

</html>
