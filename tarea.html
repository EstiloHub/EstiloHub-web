<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tarea</title>

<style>

body {
    margin: 0;
    background: #FFFFFF;
    color: #222222;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.tarjeta {
    background: #1b1b1b;
    border: 1px solid #444;
    border-radius: 12px;
    padding: 15px;
}

p {
    line-height: 1.7;
    font-size: 17px;
}

#contenido {
    white-space: pre-line;
}

.info {
    margin-bottom: 20px;
}

.aclaracion-tiempo {
    font-size: 14px;
    color: #666666;
    line-height: 1.5;
    margin-top: -8px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 20px;
}

.completar {
    background: #4CAF50;
    color: white;
    width: 280px;
    display: block;
    margin: 20px auto 0;
}

.completar:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

</style>

</head>

<body>

<div class="container">

<h1 id="titulo">
Cargando...
</h1>

<div class="tarjeta">

<div class="info">

<p>
<strong>Tiempo requerido:</strong>
<span id="tiempo"></span>
</p>

<p class="aclaracion-tiempo">
Se contabiliza únicamente el tiempo de uso activo y válido de la tarea.
Tener la página abierta sin estar en uso no se contabiliza.
</p>

</div>

<p id="contenido"></p>

<button
    id="completarBtn"
    class="completar"
    style="display:none;"
    type="button"
>
Completar tarea
</button>

</div>

</div>


<script type="module">

import { auth } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const params =
    new URLSearchParams(
        window.location.search
    );


const tareaId =
    params.get("id");


let tiempoAcumulado = 0;

let tiempoRequerido = 0;

let tiempoCorriendo = false;

let inicioLocal = null;

let tareaCompletada = false;

let intervalo = null;

let procesandoAccion = false;


const titulo =
    document.getElementById(
        "titulo"
    );


const tiempo =
    document.getElementById(
        "tiempo"
    );


const contenido =
    document.getElementById(
        "contenido"
    );


const completarBtn =
    document.getElementById(
        "completarBtn"
    );


function mostrarTiempo() {

    let tiempoActual =
        tiempoAcumulado;


    if (
        tiempoCorriendo &&
        inicioLocal
    ) {

        tiempoActual +=
            Date.now() -
            inicioLocal;

    }


    if (
        tiempoActual >=
        tiempoRequerido
    ) {

        completarBtn.style.display =
            "block";

    }

}


async function obtenerToken() {

    const user =
        auth.currentUser;


    if (!user) {

        throw new Error(
            "SESION_NO_DISPONIBLE"
        );

    }


    return await user.getIdToken(true);

}


async function enviarAccion(
    accion
) {

    if (procesandoAccion) {

        throw new Error(
            "ACCION_EN_PROCESO"
        );

    }


    procesandoAccion = true;


    try {

        const token =
            await obtenerToken();


        const respuesta =
            await fetch(
                "/api/tarea",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token

                    },

                    body:
                        JSON.stringify({

                            tarea_id:
                                tareaId,

                            accion:
                                accion

                        })

                }
            );


        let resultado =
            null;


        try {

            resultado =
                await respuesta.json();

        } catch (error) {

            resultado =
                null;

        }


        if (
            !respuesta.ok ||
            !resultado ||
            resultado.ok !== true
        ) {

            throw new Error(
                "ACCION_NO_PROCESADA"
            );

        }


        return resultado;

    } finally {

        procesandoAccion = false;

    }

}


async function iniciarConteo() {

    if (
        tareaCompletada ||
        tiempoCorriendo ||
        document.hidden
    ) {

        return;

    }


    try {

        const resultado =
            await enviarAccion(
                "iniciar"
            );


        tiempoAcumulado =
            Number(
                resultado.tiempo_acumulado ||
                0
            );


        inicioLocal =
            Date.now();


        tiempoCorriendo =
            true;


        mostrarTiempo();

    } catch (error) {

        tiempoCorriendo =
            false;

        inicioLocal =
            null;

    }

}


async function pausarConteo() {

    if (
        !tiempoCorriendo
    ) {

        return;

    }


    try {

        const resultado =
            await enviarAccion(
                "pausar"
            );


        tiempoAcumulado =
            Number(
                resultado.tiempo_acumulado ||
                0
            );


        tiempoCorriendo =
            false;


        inicioLocal =
            null;


        mostrarTiempo();

    } catch (error) {

        tiempoCorriendo =
            false;

        inicioLocal =
            null;

    }

}


async function cargarTarea() {

    if (!tareaId) {

        alert(
            "No se encontró la tarea."
        );


        window.location.href =
            "inicio.html";


        return;

    }


    try {

        const token =
            await obtenerToken();


        const respuesta =
            await fetch(
                "/api/tarea?id=" +
                encodeURIComponent(
                    tareaId
                ),
                {

                    method:
                        "GET",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }
            );


        let resultado =
            null;


        try {

            resultado =
                await respuesta.json();

        } catch (error) {

            resultado =
                null;

        }


        if (
            !respuesta.ok ||
            !resultado ||
            resultado.ok !== true
        ) {

            throw new Error(
                "TAREA_NO_DISPONIBLE"
            );

        }


        const tarea =
            resultado.tarea;


        if (
            !tarea ||
            !tarea.titulo ||
            typeof tarea.descripcion !== "string"
        ) {

            throw new Error(
                "DATOS_TAREA_INVALIDOS"
            );

        }


        titulo.textContent =
            tarea.titulo;


        tiempoRequerido =
            Number(
                tarea.tiempo_requerido
            ) *
            60 *
            1000;


        if (
            !Number.isFinite(
                tiempoRequerido
            ) ||
            tiempoRequerido <= 0
        ) {

            throw new Error(
                "TIEMPO_TAREA_INVALIDO"
            );

        }


        tiempo.textContent =
            `${tarea.tiempo_requerido} minutos`;


        contenido.textContent =
            tarea.descripcion;


        tiempoAcumulado =
            Number(
                resultado.sesion?.tiempo_acumulado ||
                0
            );


        if (
            !Number.isFinite(
                tiempoAcumulado
            ) ||
            tiempoAcumulado < 0
        ) {

            tiempoAcumulado = 0;

        }


        mostrarTiempo();


        intervalo =
            setInterval(
                mostrarTiempo,
                1000
            );


        await iniciarConteo();

    } catch (error) {

        if (
            intervalo
        ) {

            clearInterval(
                intervalo
            );

            intervalo = null;

        }


        alert(
            "No se pudo cargar la tarea."
        );


        window.location.href =
            "inicio.html";

    }

}


completarBtn.addEventListener(
    "click",
    async () => {

        if (
            tareaCompletada ||
            completarBtn.disabled
        ) {

            return;

        }


        completarBtn.disabled =
            true;


        try {

            if (
                tiempoCorriendo
            ) {

                await pausarConteo();

            }


            const resultado =
                await enviarAccion(
                    "completar"
                );


            if (
                !resultado ||
                resultado.completada !==
                true
            ) {

                throw new Error(
                    "TAREA_NO_COMPLETADA"
                );

            }


            tareaCompletada =
                true;


            if (intervalo) {

                clearInterval(
                    intervalo
                );

                intervalo = null;

            }


            alert(
                "¡Tarea completada!"
            );


            window.location.href =
                "inicio.html";

        } catch (error) {

            completarBtn.disabled =
                false;


            alert(
                "No se pudo completar la tarea. Inténtelo nuevamente."
            );

        }

    }
);


document.addEventListener(
    "visibilitychange",
    async () => {

        if (document.hidden) {

            await pausarConteo();

        } else {

            await iniciarConteo();

        }

    }
);


window.addEventListener(
    "pagehide",
    () => {

        if (intervalo) {

            clearInterval(
                intervalo
            );

            intervalo = null;

        }

    }
);


onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            window.location.href =
                "index.html";

            return;

        }


        await cargarTarea();

    }
);

</script>

</body>

</html>
