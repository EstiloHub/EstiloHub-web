<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tarea</title>

<style>

body{
  margin:0;
  background:#FFFFFF;
  color:#222222;
  font-family:Arial, sans-serif;

}

.container{
    max-width:800px;
    margin:auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.tarjeta{
    background:#1b1b1b;
    border:1px solid #444;
    border-radius:12px;
    padding:15px;

}

p{
    line-height:1.7;
    font-size:17px;
}
    
#contenido{
    white-space: pre-line;

}

.info{
    margin-bottom:20px;

}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    margin-top:20px;

}

.completar{
    background:#4CAF50;
    color:white;
    width:280px;
    display:block;
    margin:20px auto 0;

}

.volver{
    background:#555;
    color:white;

}

</style>
</head>

<body>

<div class="container">

<h1 id="titulo">
Cargando...
</h1>

<div class="tarjeta">

<div class="info">

<p><strong>Tiempo requerido:</strong> <span id="tiempo"></span></p>

</div>

<p id="contenido"></p>

<button id="completarBtn" class="completar" style="display:none;">
Completar tarea
</button>

</div>

</div>

<script type="module">
  
import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged

} from 
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  doc,
  collection,
  query,
  where,
  getDocs,
  getDoc,
  setDoc,
  updateDoc,
  increment,
  serverTimestamp

} from 
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);

const tareaId = params.get("id");

let tiempoAcumulado = 0;
let inicioTramo = null;
let tiempoCorriendo = false;
let tareaCompletada = false;

onAuthStateChanged(auth, async (user) => {

if (!user) {

 window.location.href = "index.html";
 return;

}

if (!tareaId) {
alert("No se encontró la tarea.");

window.location.href = "inicio.html";
return;

}

try {

const tareaRef = doc(db, "tareas", tareaId);

const tareaSnap = await getDoc(tareaRef);

if (!tareaSnap.exists()) {

alert("La tarea no existe.");

window.location.href = "inicio.html";
return;

}

const tarea = tareaSnap.data();

const sesionId = `${user.uid}_${tareaId}`;

const sesionRef = doc(
  db,
  "sesiones_tareas",
  sesionId
);

const sesionSnap = await getDoc(sesionRef);

if (sesionSnap.exists()) {

const datosSesion = sesionSnap.data();

tiempoAcumulado = datosSesion.tiempo_acumulado || 0;

}

document.getElementById("titulo").textContent =
tarea.titulo;

document.getElementById("tiempo").textContent = `${tarea.tiempo_requerido} minutos`;
        
document.getElementById("contenido").textContent =
tarea.descripcion;
            
const completarBtn = document.getElementById("completarBtn");

completarBtn.style.display = "none";

function iniciarConteo() {

if (tareaCompletada) return;

if (!document.hidden && !tiempoCorriendo) {

inicioTramo = Date.now();
tiempoCorriendo = true;

}

}

async function pausarConteo() {

if (!tiempoCorriendo) return;

tiempoAcumulado += Date.now() - inicioTramo;

inicioTramo = null;
tiempoCorriendo = false;

await setDoc(sesionRef, {

usuario_id: user.uid,
tarea_id: tareaId,
email: user.email,
tiempo_acumulado: tiempoAcumulado,
actualizado: serverTimestamp()

}, { merge: true });

}

document.addEventListener("visibilitychange", () => {

if (document.hidden) {

pausarConteo();

} else {

iniciarConteo();

}

});

iniciarConteo();

const revisarTiempo = setInterval(() => {

if (tareaCompletada) return;

let tiempoActual = tiempoAcumulado;

if (tiempoCorriendo && inicioTramo) {

tiempoActual += Date.now() - inicioTramo;

}

const tiempoRequerido =
tarea.tiempo_requerido * 60 * 1000;

if (tiempoActual >= tiempoRequerido) {

completarBtn.style.display = "block";

}

}, 1000);
        
completarBtn.addEventListener("click", async () => {

if (tareaCompletada) return;

if (tiempoCorriendo) {

tiempoAcumulado += Date.now() - inicioTramo;

inicioTramo = null;

tiempoCorriendo = false;

}

await setDoc(sesionRef, {

usuario_id: user.uid,
tarea_id: tareaId,
email: user.email,
tiempo_acumulado: tiempoAcumulado,
actualizado: serverTimestamp()

}, { merge: true });

const tiempoRequerido =
tarea.tiempo_requerido * 60 * 1000;

if (tiempoAcumulado < tiempoRequerido) {

alert("Todavía no cumpliste el tiempo requerido.");

return;

}

tareaCompletada = true;

clearInterval(revisarTiempo);
            
try {
                          
const progresoId = `${user.uid}_${tareaId}`;

const progresoRef = doc(
   db,
   "progreso_tareas",
   progresoId

);

const progresoSnap = await getDoc(progresoRef);

if (progresoSnap.exists()) {
    
await updateDoc(progresoRef, {
veces_realizada: increment(1),
fecha_realizada: serverTimestamp(),
titulo_tarea: tarea.titulo,
minutos_realizados: increment(
tarea.tiempo_requerido

)
  
});

} else {

await setDoc(progresoRef, {
email: user.email,
usuario_id: user.uid,
tarea_id: tareaId,
titulo_tarea: tarea.titulo,
fecha_realizada: serverTimestamp(),
veces_realizada: 1,
minutos_realizados:
tarea.tiempo_requerido

});

}

await setDoc(sesionRef, {

usuario_id: user.uid,
tarea_id: tareaId,
email: user.email,
tiempo_acumulado: tiempoAcumulado,
completada: true,
fecha_completada: serverTimestamp()

}, { merge: true });
        
const consultaEstadisticas = query(
collection(db, "estadisticas_usuario"),
where("usuario_id", "==", user.uid) 

);

const resultadoEstadisticas = await getDocs(consultaEstadisticas);

if (resultadoEstadisticas.empty) {

alert("No se encontró el documento de estadísticas.");
return;

}

const estadisticasRef = resultadoEstadisticas.docs[0].ref;

const estadisticasSnap = resultadoEstadisticas.docs[0];


if (estadisticasSnap.exists()) {

const datos =estadisticasSnap.data();

let sumarDia = false;

if (!datos.ultima_fecha_trabajo) {

 sumarDia = true;

} else {

const ultima =
datos.ultima_fecha_trabajo.toDate();

const hoy = new Date();

if (

ultima.getFullYear() !== hoy.getFullYear() ||

ultima.getMonth() !== hoy.getMonth() ||

ultima.getDate() !== hoy.getDate()

) {

sumarDia = true;

}

}

const actualizar = {

tareas_realizadas:
increment(1),

minutos_acumulados:
increment(
tarea.tiempo_requerido
),

ultima_fecha_trabajo:
serverTimestamp()

};

if (sumarDia) {

actualizar.dias_trabajados =
increment(1);

}

await updateDoc(
estadisticasRef,
actualizar

);

}

alert("¡Tarea completada!");
completarBtn.disabled= true;

window.location.href = "inicio.html";

} catch (error) {

alert("Error al completar la tarea.");

}

});

} catch (error) {
 
alert("Error al cargar la tarea.");

}

});

</script>
</body>
</html>
