<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarea - Estilo Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8fc;
      color: #1f2937;
    }

    .contenedor {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .tarjeta {
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      line-height: 1.3;
      color: #1e5fa7;
    }

    .dato {
      margin-bottom: 16px;
    }

    .dato strong {
      display: block;
      margin-bottom: 6px;
      color: #374151;
    }

    .tiempo {
      font-size: 30px;
      font-weight: bold;
      color: #1769aa;
      margin: 8px 0 20px;
    }

    .estado {
      padding: 10px 12px;
      border-radius: 8px;
      background: #eef6ff;
      color: #185a91;
      margin-bottom: 18px;
    }

    .contenido {
      line-height: 1.6;
      margin-bottom: 20px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .acciones {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #iniciarBtn,
    #reanudarBtn,
    #completarBtn {
      background: #1769aa;
      color: #ffffff;
    }

    #pausarBtn {
      background: #e7eef6;
      color: #174a73;
    }

    .oculto {
      display: none !important;
    }

    .mensaje {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #fff4e5;
      color: #7a4b00;
      display: none;
    }

    .error {
      background: #fdecec;
      color: #9b1c1c;
    }

    .exito {
      background: #eaf8ef;
      color: #176b36;
    }

    @media (max-width: 480px) {
      .contenedor {
        padding: 14px 12px 30px;
      }

      .tarjeta {
        padding: 18px;
      }

      h1 {
        font-size: 21px;
      }

      .tiempo {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <div class="tarjeta">

      <h1 id="tituloTarea">Cargando tarea...</h1>

      <div class="dato">
        <strong>Tiempo requerido</strong>
        <div id="tiempoRequerido">--</div>
      </div>

      <div class="dato">
        <strong>Tiempo válido realizado</strong>
        <div id="tiempoValido" class="tiempo">00:00</div>
      </div>

      <div id="estadoTarea" class="estado">
        Cargando...
      </div>

      <div id="descripcionTarea" class="contenido"></div>

      <div id="acciones" class="acciones">
        <button id="iniciarBtn" class="oculto">Iniciar</button>
        <button id="reanudarBtn" class="oculto">Reanudar</button>
        <button id="pausarBtn" class="oculto">Pausar</button>
        <button id="completarBtn" class="oculto" disabled>
          Completar
        </button>
      </div>

      <div id="mensaje" class="mensaje"></div>

    </div>
  </div>

  <script type="module">
    import {
      auth
    } from "./firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const tareaId =
      new URLSearchParams(window.location.search).get("id");

    const tituloTarea =
      document.getElementById("tituloTarea");

    const tiempoRequeridoElemento =
      document.getElementById("tiempoRequerido");

    const tiempoValidoElemento =
      document.getElementById("tiempoValido");

    const estadoTarea =
      document.getElementById("estadoTarea");

    const descripcionTarea =
      document.getElementById("descripcionTarea");

    const mensaje =
      document.getElementById("mensaje");

    const iniciarBtn =
      document.getElementById("iniciarBtn");

    const reanudarBtn =
      document.getElementById("reanudarBtn");

    const pausarBtn =
      document.getElementById("pausarBtn");

    const completarBtn =
      document.getElementById("completarBtn");

    let usuarioActual = null;

    let tarea = null;
    let realizacion = null;
    let sesion = null;

    let tiempoActivoValido = 0;
    let tiempoRequerido = 0;

    let corriendo = false;

    let inicioLocal = null;
    let tiempoLocalBase = 0;

    let intervaloVisual = null;
    let intervaloHeartbeat = null;
    let intervaloActividad = null;

    let enviandoAccion = false;
    let paginaCerrandose = false;

    const instanciaId =
      `${Date.now()}_${Math.random().toString(36).slice(2, 12)}`;

    function formatearTiempo(ms) {
      const totalSegundos =
        Math.floor(Math.max(0, ms) / 1000);

      const horas =
        Math.floor(totalSegundos / 3600);

      const minutos =
        Math.floor((totalSegundos % 3600) / 60);

      const segundos =
        totalSegundos % 60;

      const hh =
        String(horas).padStart(2, "0");

      const mm =
        String(minutos).padStart(2, "0");

      const ss =
        String(segundos).padStart(2, "0");

      if (horas > 0) {
        return `${hh}:${mm}:${ss}`;
      }

      return `${mm}:${ss}`;
    }

    function mostrarMensaje(texto, tipo = "") {
      mensaje.textContent = texto;
      mensaje.className = "mensaje";

      if (tipo) {
        mensaje.classList.add(tipo);
      }

      mensaje.style.display = "block";
    }

    function ocultarMensaje() {
      mensaje.style.display = "none";
      mensaje.textContent = "";
    }

    function establecerEstado(texto) {
      estadoTarea.textContent = texto;
    }

    function detenerIntervalos() {
      if (intervaloVisual) {
        clearInterval(intervaloVisual);
        intervaloVisual = null;
      }

      if (intervaloHeartbeat) {
        clearInterval(intervaloHeartbeat);
        intervaloHeartbeat = null;
      }

      if (intervaloActividad) {
        clearInterval(intervaloActividad);
        intervaloActividad = null;
      }
    }

    function obtenerTiempoVisual() {
      if (!corriendo || inicioLocal === null) {
        return tiempoLocalBase;
      }

      return tiempoLocalBase +
        (Date.now() - inicioLocal);
    }

    function actualizarTiempoVisual() {
      const tiempo =
        obtenerTiempoVisual();

      tiempoValidoElemento.textContent =
        formatearTiempo(
          Math.min(
            tiempo,
            tiempoRequerido
          )
        );

      const alcanzado =
        tiempo >= tiempoRequerido;

      completarBtn.disabled =
        !alcanzado || enviandoAccion;

      if (alcanzado) {
        establecerEstado(
          "Tiempo requerido alcanzado. Ya puedes completar la tarea."
        );
      } else if (corriendo) {
        establecerEstado(
          "Tarea en curso."
        );
      }
    }

    function iniciarIntervaloVisual() {
      if (intervaloVisual) {
        clearInterval(intervaloVisual);
      }

      intervaloVisual =
        setInterval(
          actualizarTiempoVisual,
          250
        );

      actualizarTiempoVisual();
    }

    function iniciarHeartbeat() {
      if (intervaloHeartbeat) {
        clearInterval(intervaloHeartbeat);
      }

      intervaloHeartbeat =
        setInterval(
          async () => {
            if (!corriendo || enviandoAccion) {
              return;
            }

            await enviarAccion(
              "heartbeat",
              false
            );
          },
          10000
        );
    }

    function iniciarRegistroActividad() {
      if (intervaloActividad) {
        clearInterval(intervaloActividad);
      }

      intervaloActividad =
        setInterval(
          async () => {
            if (!corriendo || enviandoAccion) {
              return;
            }

            await enviarAccion(
              "actividad",
              false
            );
          },
          10000
        );
    }

    function comenzarConteoLocal(tiempoBase) {
      tiempoLocalBase =
        Number(tiempoBase) || 0;

      inicioLocal = Date.now();
      corriendo = true;

      iniciarIntervaloVisual();
      iniciarHeartbeat();
      iniciarRegistroActividad();

      pausarBtn.classList.remove("oculto");
      iniciarBtn.classList.add("oculto");
      reanudarBtn.classList.add("oculto");
    }

    function detenerConteoLocal(tiempoBase) {
      tiempoLocalBase =
        Number(tiempoBase) || 0;

      inicioLocal = null;
      corriendo = false;

      if (intervaloVisual) {
        clearInterval(intervaloVisual);
        intervaloVisual = null;
      }

      if (intervaloHeartbeat) {
        clearInterval(intervaloHeartbeat);
        intervaloHeartbeat = null;
      }

      if (intervaloActividad) {
        clearInterval(intervaloActividad);
        intervaloActividad = null;
      }

      actualizarTiempoVisual();

      pausarBtn.classList.add("oculto");

      if (
        tiempoLocalBase >=
        tiempoRequerido
      ) {
        completarBtn.disabled = false;
        establecerEstado(
          "Tiempo requerido alcanzado. Ya puedes completar la tarea."
        );
      } else {
        reanudarBtn.classList.remove("oculto");
        establecerEstado(
          "Tarea pausada."
        );
      }
    }

    async function obtenerToken() {
      if (!usuarioActual) {
        throw new Error(
          "No hay un usuario autenticado."
        );
      }

      return usuarioActual.getIdToken(true);
    }

    async function enviarAccion(
      accion,
      mostrarErrores = true
    ) {
      if (
        enviandoAccion &&
        accion !== "heartbeat" &&
        accion !== "actividad"
      ) {
        return null;
      }

      try {
        if (
          accion !== "heartbeat" &&
          accion !== "actividad"
        ) {
          enviandoAccion = true;
        }

        const token =
          await obtenerToken();

        const respuesta =
          await fetch("/api/tarea", {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json",
              "Authorization":
                `Bearer ${token}`
            },
            body: JSON.stringify({
              tarea_id: tareaId,
              accion,
              instancia_id: instanciaId
            })
          });

        const resultado =
          await respuesta.json();

        if (!respuesta.ok || !resultado.ok) {
          const error =
            new Error(
              resultado.mensaje ||
              resultado.error ||
              "No se pudo procesar la acción."
            );

          error.codigo =
            resultado.error || "";

          throw error;
        }

        return resultado;
      } catch (error) {
        if (
          mostrarErrores &&
          !paginaCerrandose
        ) {
          mostrarMensaje(
            error.message ||
            "Ocurrió un error.",
            "error"
          );
        }

        if (
          error.codigo ===
          "SESION_PAUSADA"
        ) {
          corriendo = false;

          detenerConteoLocal(
            tiempoLocalBase
          );

          establecerEstado(
            "La sesión fue pausada. Puedes reanudarla."
          );
        }

        return null;
      } finally {
        if (
          accion !== "heartbeat" &&
          accion !== "actividad"
        ) {
          enviandoAccion = false;
        }
      }
    }

    async function iniciarConteo() {
      ocultarMensaje();

      const resultado =
        await enviarAccion(
          "iniciar"
        );

      if (!resultado) {
        return;
      }

      realizacion =
        resultado.realizacion || null;

      sesion =
        resultado.sesion || null;

      tiempoActivoValido =
        Number(
          resultado.realizacion
            ?.tiempo_activo_valido
        ) || 0;

      tiempoLocalBase =
        tiempoActivoValido;

      comenzarConteoLocal(
        tiempoActivoValido
      );

      establecerEstado(
        "Tarea en curso."
      );
    }

    async function pausarConteo() {
      if (!corriendo) {
        return;
      }

      ocultarMensaje();

      const resultado =
        await enviarAccion(
          "pausar"
        );

      if (!resultado) {
        return;
      }

      realizacion =
        resultado.realizacion || realizacion;

      sesion =
        resultado.sesion || null;

      tiempoActivoValido =
        Number(
          resultado.realizacion
            ?.tiempo_activo_valido
        ) || tiempoActivoValido;

      detenerConteoLocal(
        tiempoActivoValido
      );
    }

    async function reanudarConteo() {
      ocultarMensaje();

      const resultado =
        await enviarAccion(
          "iniciar"
        );

      if (!resultado) {
        return;
      }

      realizacion =
        resultado.realizacion || realizacion;

      sesion =
        resultado.sesion || null;

      tiempoActivoValido =
        Number(
          resultado.realizacion
            ?.tiempo_activo_valido
        ) || tiempoActivoValido;

      comenzarConteoLocal(
        tiempoActivoValido
      );

      establecerEstado(
        "Tarea en curso."
      );
    }

    async function completarTarea() {
      if (enviandoAccion) {
        return;
      }

      const tiempoActual =
        obtenerTiempoVisual();

      if (
        tiempoActual <
        tiempoRequerido
      ) {
        mostrarMensaje(
          "Todavía no se alcanzó el tiempo requerido.",
          "error"
        );

        return;
      }

      ocultarMensaje();

      if (corriendo) {
        const pausa =
          await enviarAccion(
            "pausar"
          );

        if (!pausa) {
          return;
        }

        realizacion =
          pausa.realizacion ||
          realizacion;

        sesion =
          pausa.sesion || null;

        tiempoActivoValido =
          Number(
            pausa.realizacion
              ?.tiempo_activo_valido
          ) || tiempoActivoValido;

        detenerConteoLocal(
          tiempoActivoValido
        );
      }

      const resultado =
        await enviarAccion(
          "completar"
        );

      if (!resultado) {
        return;
      }

      detenerConteoLocal(
        tiempoRequerido
      );

      completarBtn.disabled = true;
      iniciarBtn.classList.add("oculto");
      reanudarBtn.classList.add("oculto");
      pausarBtn.classList.add("oculto");

      establecerEstado(
        "Tarea completada correctamente."
      );

      mostrarMensaje(
        "La tarea fue completada.",
        "exito"
      );
    }

    async function cargarTarea() {
      ocultarMensaje();

      try {
        const token =
          await obtenerToken();

        const url =
          `/api/tarea?id=${encodeURIComponent(
            tareaId
          )}&instancia_id=${encodeURIComponent(
            instanciaId
          )}`;

        const respuesta =
          await fetch(url, {
            method: "GET",
            headers: {
              "Authorization":
                `Bearer ${token}`
            }
          });

        const resultado =
          await respuesta.json();

        if (
          !respuesta.ok ||
          !resultado.ok
        ) {
          throw new Error(
            resultado.mensaje ||
            resultado.error ||
            "No se pudo cargar la tarea."
          );
        }

        tarea =
          resultado.tarea;

        realizacion =
          resultado.realizacion;

        sesion =
          resultado.sesion;

        tituloTarea.textContent =
          tarea.titulo || "Tarea";

        descripcionTarea.textContent =
          tarea.descripcion || "";

        tiempoRequerido =
          Number(
            tarea.tiempo_requerido
          ) * 60000;

        tiempoRequeridoElemento.textContent =
          formatearTiempo(
            tiempoRequerido
          );

        tiempoActivoValido =
          Number(
            realizacion
              ?.tiempo_activo_valido
          ) || 0;

        tiempoLocalBase =
          tiempoActivoValido;

        tiempoValidoElemento.textContent =
          formatearTiempo(
            Math.min(
              tiempoActivoValido,
              tiempoRequerido
            )
          );

        if (!realizacion) {
          establecerEstado(
            "Tarea disponible."
          );

          iniciarBtn.classList.remove(
            "oculto"
          );

          reanudarBtn.classList.add(
            "oculto"
          );

          pausarBtn.classList.add(
            "oculto"
          );

          completarBtn.classList.add(
            "oculto"
          );

          return;
        }

        completarBtn.classList.remove(
          "oculto"
        );

        if (
          Number(
            realizacion.tiempo_activo_valido
          ) >= tiempoRequerido
        ) {
          establecerEstado(
            "Tiempo requerido alcanzado. Ya puedes completar la tarea."
          );

          iniciarBtn.classList.add(
            "oculto"
          );

          reanudarBtn.classList.add(
            "oculto"
          );

          pausarBtn.classList.add(
            "oculto"
          );

          completarBtn.disabled = false;

          return;
        }

        if (
          sesion &&
          sesion.activa === true
        ) {
          tiempoActivoValido =
            Number(
              sesion.tiempo_activo_valido
            ) || tiempoActivoValido;

          comenzarConteoLocal(
            tiempoActivoValido
          );

          establecerEstado(
            "Tarea en curso."
          );

          return;
        }

        establecerEstado(
          "Tarea pausada."
        );

        iniciarBtn.classList.add(
          "oculto"
        );

        reanudarBtn.classList.remove(
          "oculto"
        );

        pausarBtn.classList.add(
          "oculto"
        );

        completarBtn.disabled = true;

      } catch (error) {
        mostrarMensaje(
          error.message ||
          "No se pudo cargar la tarea.",
          "error"
        );

        iniciarBtn.classList.add(
          "oculto"
        );

        reanudarBtn.classList.add(
          "oculto"
        );

        pausarBtn.classList.add(
          "oculto"
        );

        completarBtn.classList.add(
          "oculto"
        );
      }
    }

    iniciarBtn.addEventListener(
      "click",
      iniciarConteo
    );

    reanudarBtn.addEventListener(
      "click",
      reanudarConteo
    );

    pausarBtn.addEventListener(
      "click",
      pausarConteo
    );

    completarBtn.addEventListener(
      "click",
      completarTarea
    );

    document.addEventListener(
      "visibilitychange",
      async () => {
        if (document.hidden) {
          if (corriendo) {
            await pausarConteo();
          }
        }
      }
    );

    window.addEventListener(
      "pagehide",
      () => {
        paginaCerrandose = true;

        if (corriendo) {
          detenerConteoLocal(
            obtenerTiempoVisual()
          );

          const enviar =
            async () => {
              try {
                const token =
                  await obtenerToken();

                await fetch(
                  "/api/tarea",
                  {
                    method: "POST",
                    keepalive: true,
                    headers: {
                      "Content-Type":
                        "application/json",
                      "Authorization":
                        `Bearer ${token}`
                    },
                    body: JSON.stringify({
                      tarea_id: tareaId,
                      accion: "pausar",
                      instancia_id:
                        instanciaId
                    })
                  }
                );
              } catch (_) {
              }
            };

          enviar();
        }
      }
    );

    onAuthStateChanged(
      auth,
      async (user) => {
        if (!user) {
          window.location.href =
            "login.html";

          return;
        }

        usuarioActual = user;

        if (!tareaId) {
          mostrarMensaje(
            "No se indicó una tarea.",
            "error"
          );

          return;
        }

        await cargarTarea();
      }
    );
  </script>
</body>
</html>
